<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العبادة المناسبة لوقتك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <header class="p-4 border-b border-emerald-800/50 bg-slate-950/80 backdrop-blur sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                <span>⏱️</span> العبادة المناسبة لوقتك
            </h1>
            <span class="text-xs bg-emerald-950 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-800">تطبيق مجاني</span>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full p-4 flex-1 flex flex-col justify-center">
        <div class="bg-slate-800/90 border border-slate-700 p-6 rounded-2xl shadow-xl backdrop-blur">
            <h2 class="text-lg font-bold text-center mb-2 text-slate-200">كم دقيقة متاحة معك الآن؟</h2>
            <p class="text-xs text-slate-400 text-center mb-6">ادخل الوقت المتاح وسنرتّب لك خطة عبادة تناسب وقتك تماماً</p>

            <div class="mb-4">
                <input type="number" id="minutesInput" placeholder="أدخل عدد الدقائق (مثلاً: 10)" 
                    class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-xl p-3 text-center text-lg text-emerald-400 font-bold outline-none transition">
            </div>

            <div class="grid grid-cols-3 gap-2 mb-6">
                <button onclick="quickSet(3)" class="bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg border border-slate-600 transition">3 دقائق</button>
                <button onclick="quickSet(7)" class="bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg border border-slate-600 transition">7 دقائق</button>
                <button onclick="quickSet(15)" class="bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg border border-slate-600 transition">15 دقيقة</button>
                <button onclick="quickSet(30)" class="bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg border border-slate-600 transition">30 دقيقة</button>
                <button onclick="quickSet(45)" class="bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg border border-slate-600 transition">45 دقيقة</button>
                <button onclick="quickSet(120)" class="bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg border border-slate-600 transition">ساعتين</button>
            </div>

            <button onclick="generatePlan()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-900/30 transition">
                اقترح لي الخطة المناسبة 🚀
            </button>
        </div>

        <div id="planResult" class="hidden mt-6 bg-slate-800/90 border border-emerald-800/60 p-6 rounded-2xl shadow-xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 id="planTitle" class="font-bold text-emerald-400 text-base"></h3>
                <span id="planTimeBadge" class="text-xs bg-emerald-900/50 text-emerald-300 px-2.5 py-1 rounded-md border border-emerald-700"></span>
            </div>
            <ul id="planList" class="space-y-3 mb-4"></ul>
            <div class="p-3 bg-emerald-950/40 border border-emerald-900/50 rounded-xl text-center">
                <p class="text-xs text-emerald-300 font-medium">«أَحَبُّ الأَعْمَالِ إِلَى اللهِ أَدْوَمُهَا وَإِنْ قَلَّ»</p>
            </div>
        </div>
    </main>

    <footer class="p-4 text-center text-xs text-slate-500 border-t border-slate-800">
        صدقة جارية • العبادة المناسبة لوقتك
    </footer>

    <script>
        function quickSet(min) {
            document.getElementById('minutesInput').value = min;
            generatePlan();
        }

        function generatePlan() {
            const input = document.getElementById('minutesInput');
            const minutes = parseInt(input.value);

            if (!minutes || minutes <= 0) {
                alert('من فضلك أدخل عدد دقائق صحيح');
                return;
            }

            const resultDiv = document.getElementById('planResult');
            const planTitle = document.getElementById('planTitle');
            const planTimeBadge = document.getElementById('planTimeBadge');
            const planList = document.getElementById('planList');

            let title = "";
            let items = [];

            if (minutes <= 4) {
                title = "خطة الذكر والاستغفار السريع";
                items = ["⏱️ **دقيقة:** استغفار وصلاة على النبي ﷺ بقلب حاضر.", "⏱️ **دقيقتين:** دعاء شامل لنفسك ولوالديك ولمن تحب."];
            } else if (minutes <= 10) {
                title = "خطة البركة والتلاوة السريعة";
                items = ["⏱️ **دقيقتين:** أذكار (سبحان الله وبحمده 100 مرة).", "⏱️ **5-8 دقائق:** قراءة صفحتين من القرآن الكريم."];
            } else if (minutes <= 20) {
                title = "خطة التدبر والسكينة";
                items = ["⏱ **10 دقائق:** قراءة من 3 إلى 5 صفحات من القرآن الكريم.", "⏱️ **5 دقائق:** قراءة تفسير آية واحدة وقفت عندها.", "⏱️ **5 دقائق:** أذكار ودعاء ومناجاة."];
            } else if (minutes <= 45) {
                title = "خطة البناء والعلم";
                items = ["⏱️ **20 دقيقة:** تلاوة نصف جزء من القرآن الكريم.", "⏱️ **15 دقيقة:** سماع مقطع أو درس ديني قصير.", "⏱️ **10 دقائق:** استغفار ودعاء وصلاة على النبي ﷺ."];
            } else {
                title = "خطة العبادة المتكاملة";
                items = ["⏱️ **30 دقيقة:** قراءة جزء كامل من القرآن الكريم.", "⏱️ **40 دقيقة:** الاستماع لدرس ديني متكامل أو بودكاست نافع.", "⏱️ **20 دقيقة:** جلسة ذكر وتدبر ودعاء.", "⏱️ **الوقت المتبقي:** صلاة ركعتين (قيام ليل أو ضحى)."];
            }

            planTitle.innerText = title;
            planTimeBadge.innerText = minutes + " دقيقة";
            planList.innerHTML = items.map(item => {
                const formatted = item.replace(/\*\*(.*?)\*\*/g, '<strong class="text-slate-200">$1</strong>');
                return `<li class="text-sm text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 flex items-start gap-2"><span>✨</span><div>${formatted}</div></li>`;
            }).join('');

            resultDiv.classList.remove('hidden');
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
